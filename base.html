<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HH.ru Парсер - {% block title %}Главная{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">HH.ru Парсер</a>
            <ul class="nav-menu">
                <li><a href="/">Главная</a></li>
                <li><a href="/search">Поиск</a></li>
                <li><a href="/contacts">Контакты</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 HH.ru Парсер. Все права защищены.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
